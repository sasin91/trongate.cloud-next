name: verify
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'NOTICE']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'NOTICE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only
          MARIADB_DATABASE: tc
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sodium, curl
      - run: make check
      - name: Native login and module routes on MariaDB
        run: make test-web
        env:
          TC_WEB_MYSQL: mysql:host=127.0.0.1
          TC_DB_USER: root
          TC_DB_PASSWORD: test-only
      - name: MariaDB queue and serialization
        run: make test-mariadb
        env:
          TC_DSN: mysql:host=127.0.0.1;dbname=tc
          TC_DB_USER: root
          TC_DB_PASSWORD: test-only

  deploy:
    name: deploy to tc-host1
    needs: php
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-tc-host1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Tailscale (ephemeral CI node)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy verified commit via forced-command SSH
        env:
          TC_DEPLOY_HOST: ${{ secrets.TC_DEPLOY_HOST }}
          TC_DEPLOY_SSH_KEY: ${{ secrets.TC_DEPLOY_SSH_KEY }}
          TC_DEPLOY_KNOWN_HOSTS: ${{ secrets.TC_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$TC_DEPLOY_SSH_KEY" > "$HOME/.ssh/tc_deploy_key"
          printf '%s\n' "$TC_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tc_deploy_key" "$HOME/.ssh/known_hosts"
          RESULT="$(git archive --format=tar.gz HEAD | ssh -T \
            -i "$HOME/.ssh/tc_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "tc-deploy@${TC_DEPLOY_HOST}")"
          printf '%s\n' "$RESULT"
          printf '%s' "$RESULT" | grep -q '"status":"succeeded"'
