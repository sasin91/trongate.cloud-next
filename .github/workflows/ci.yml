name: verify
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'NOTICE']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'NOTICE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only
          MARIADB_DATABASE: tc
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sodium, curl
      - run: make check
      - name: Native login and module routes on MariaDB
        run: make test-web
        env:
          TC_WEB_MYSQL: mysql:host=127.0.0.1
          TC_DB_USER: root
          TC_DB_PASSWORD: test-only
      - name: MariaDB queue and serialization
        run: make test-mariadb
        env:
          TC_DSN: mysql:host=127.0.0.1;dbname=tc
          TC_DB_USER: root
          TC_DB_PASSWORD: test-only
