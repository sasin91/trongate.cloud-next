# Allow tc-agent to invoke ONLY tc-runtime with zero CLI arguments (JSON over stdin/stdout).
permit nopass tc-agent as root cmd /usr/local/libexec/tc-runtime args

# Allow tc-deploy (GitHub Actions CI/CD) to invoke ONLY tc-self-deploy with zero CLI arguments (tar.gz over stdin).
permit nopass tc-deploy as root cmd /usr/local/libexec/tc-self-deploy args
